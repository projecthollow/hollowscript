[workspace]
resolver = "3"
members = ["crates/hollowscript", "crates/hollowscript-bytecode", "crates/hollowscript-capi", "crates/hollowscript-cli", "crates/hollowscript-core", "crates/hollowscript-check", "crates/hollowscript-conformance", "crates/hollowscript-hostfs", "crates/hollowscript-ide", "crates/hollowscript-lsp", "crates/hollowscript-compiler", "crates/hollowscript-syntax", "crates/hollowscript-vm", "crates/hollowscript-wasm", "xtask"]
# `fuzz/` is a separate `cargo-fuzz` crate, not shipped and not part of this
# workspace's own dependency and lint policy: see docs/design/fuzzing.md.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0 OR MIT"
homepage = "https://hollowscript.org"
keywords = ["hollowscript", "scripting", "embeddable", "language"]
categories = ["compilers"]

# Internal crates. Declared once here so that every member refers to the same
# path. Entries for crates that do not exist yet are ignored by Cargo.
[workspace.dependencies]
hollowscript = { path = "crates/hollowscript", version = "0.1.1" }
hollowscript-bytecode = { path = "crates/hollowscript-bytecode", version = "0.1.1" }
hollowscript-check = { path = "crates/hollowscript-check", version = "0.1.1" }
hollowscript-compiler = { path = "crates/hollowscript-compiler", version = "0.1.1" }
hollowscript-core = { path = "crates/hollowscript-core", version = "0.1.1" }
hollowscript-hostfs = { path = "crates/hollowscript-hostfs", version = "0.1.1" }
hollowscript-ide = { path = "crates/hollowscript-ide", version = "0.1.1" }
hollowscript-lsp = { path = "crates/hollowscript-lsp", version = "0.1.1" }
hollowscript-syntax = { path = "crates/hollowscript-syntax", version = "0.1.1" }
hollowscript-vm = { path = "crates/hollowscript-vm", version = "0.1.1" }

[workspace.lints.rust]
unsafe_code = "deny"
non_ascii_idents = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unused_qualifications = "warn"
unused_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unit_bindings = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that cost more than they give in this code base.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
similar_names = "allow"
# Rigour for code that faces hostile input: no panics, no stray output.
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"
print_stdout = "deny"
print_stderr = "deny"
exit = "deny"
mem_forget = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"

[profile.dev]
# Hostile-input arithmetic is written with checked and saturating operations.
# Overflow checks stay on in every profile used by the fuzzers and the tests.
overflow-checks = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
# Unwinding stays on so that the C interface can stop a panic at the boundary.
panic = "unwind"
# Same reasoning as [profile.dev] above: hostile-input arithmetic is written
# checked and saturating, but that only holds if a panicking overflow is
# still there to catch what a review missed. A shipped release binary is
# exactly the build that promise has to hold in, not only the ones this
# workspace tests with.
overflow-checks = true

# What `scripts/release-build.sh` ships: the release profile, with every
# symbol and all debug information stripped by rustc itself
# (`-C strip=symbols`, which works the same for Mach-O, ELF, PE and
# WebAssembly, unlike running a separate `strip`/`objcopy` afterwards), so
# no symbol table or debug path is left in a shipped binary. A static
# library (`.a`) keeps the symbols a C linker needs regardless.
[profile.dist]
inherits = "release"
debug = false
strip = "symbols"

# Used to measure the size budget of the command line tool and the browser VM.
[profile.min-size]
inherits = "release"
opt-level = "z"
lto = "fat"
debug = false
strip = "symbols"
