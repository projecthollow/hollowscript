# Pinned to one exact release, not a channel: a release build must be
# reproducible from its tag alone, and `stable` names a different compiler
# every six weeks (docs/design/release.md, section 1). Bump deliberately, in
# its own change, once `scripts/check` passes on the new version.
[toolchain]
channel = "1.98.1"
components = ["clippy", "rustfmt"]
profile = "minimal"
